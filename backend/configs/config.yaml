server:
  host: "0.0.0.0"
  port: 8080

pelican:
  url: ""
  api_key: ""
  timeout: 15s

discovery:
  interval: 30s

router:
  backend: "infrared"
  domain: ""

infrared:
  proxies_path: "/etc/infrared/proxies"
  reload_marker_path: "/etc/infrared/control/infrared.reload"

logging:
  level: "info"
  format: "json"