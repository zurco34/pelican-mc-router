server:
  host: "0.0.0.0"
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 1m

database:
  path: "./data/pelican-mc-router.db"

pelican:
  url: ""
  api_key: ""
  timeout: 15s

discovery:
  interval: 30s
  wildcard_backend_host: ""

router:
  backend: "mc-router"
  domain: ""

mcrouter:
  api_url: "http://mc-router:8080"

infrared:
  proxies_path: "/etc/infrared/proxies"
  reload_marker_path: "/etc/infrared/control/infrared.reload"

logging:
  level: "info"
  format: "json"
