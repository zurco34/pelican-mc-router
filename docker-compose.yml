services:
  mc-router:
    image: "${MC_ROUTER_IMAGE:-docker.io/itzg/mc-router:1.44.0}"
    restart: unless-stopped

    environment:
      API_BINDING: "0.0.0.0:8080"
      ROUTES_CONFIG: "/tmp/routes.json"
      LOG_LEVEL: "${MC_ROUTER_LOG_LEVEL:-info}"
      TZ: "${TZ:-UTC}"

    ports:
      - "${MINECRAFT_BIND_ADDRESS:-0.0.0.0}:${MINECRAFT_PORT:-25565}:25565/tcp"

    networks:
      - router-control

    user: "10001:10001"
    read_only: true

    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

  pelican-mc-router:
    image: "${PELICAN_MC_ROUTER_IMAGE:-pelican-mc-router:local}"

    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: "${PELICAN_MC_ROUTER_VERSION:-dev}"
        REVISION: "${PELICAN_MC_ROUTER_REVISION:-unknown}"

    restart: unless-stopped

    depends_on:
      - mc-router

    environment:
      PELICAN_MC_ROUTER_SERVER_HOST: "0.0.0.0"
      PELICAN_MC_ROUTER_SERVER_PORT: "8080"
      PELICAN_MC_ROUTER_DATABASE_PATH: "/app/data/pelican-mc-router.db"

      PELICAN_MC_ROUTER_DISCOVERY_WILDCARD_BACKEND_HOST: "${PELICAN_MC_ROUTER_DISCOVERY_WILDCARD_BACKEND_HOST:-}"

      PELICAN_MC_ROUTER_ROUTER_BACKEND: "mc-router"
      PELICAN_MC_ROUTER_MCROUTER_API_URL: "http://mc-router:8080"

      PELICAN_MC_ROUTER_LOGGING_LEVEL: "${PELICAN_MC_ROUTER_LOG_LEVEL:-info}"
      PELICAN_MC_ROUTER_LOGGING_FORMAT: "json"

      TZ: "${TZ:-UTC}"

    ports:
      - "${PELICAN_MC_ROUTER_BIND_ADDRESS:-127.0.0.1}:${PELICAN_MC_ROUTER_HTTP_PORT:-8080}:8080/tcp"

    volumes:
      - pelican-mc-router-data:/app/data

    networks:
      - router-control

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  pelican-mc-router-data:

networks:
  router-control:
    driver: bridge
