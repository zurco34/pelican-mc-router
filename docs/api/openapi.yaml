openapi: 3.1.0
info:
  title: Pelican MC Router API
  version: 1.0.0
  description: Versioned management API. Responses never include credentials or raw backend errors.
paths:
  /health:
    get:
      summary: Process liveness
      responses: {'200': {description: OK}}
  /ready:
    get:
      summary: Reconciliation readiness
      responses: {'200': {description: Ready}, '503': {description: Not ready}}
  /metrics:
    get:
      summary: Prometheus metrics
      responses: {'200': {description: Prometheus text exposition}}
  /api/v1/status:
    get:
      summary: Cached operational status
      security: [{bearerAuth: []}]
      responses: {'200': {description: Status}, '401': {description: Authentication required}, '403': {description: Access denied}}
  /api/v1/servers:
    get:
      summary: Cached discovered servers
      security: [{bearerAuth: []}]
      responses: {'200': {description: Servers}}
  /api/v1/routes:
    get:
      summary: Cached generated routes
      security: [{bearerAuth: []}]
      responses: {'200': {description: Routes}}
  /api/v1/routes/preview:
    get:
      summary: Route preview without backend mutation
      security: [{bearerAuth: []}]
      responses: {'200': {description: Preview}}
  /api/v1/operational-history:
    get:
      summary: Bounded safe operational history
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100}
      responses: {'200': {description: Events}, '400': {description: Invalid limit}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
