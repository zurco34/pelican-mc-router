name: Release Container

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - "docker/Dockerfile"
      - "backend/**"

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  validate:
    name: Validate release image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container

  publish:
    name: Publish release image
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          readonly semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'

          if [[ ! "${GITHUB_REF_NAME}" =~ ${semver_pattern} ]]; then
            printf \
              'Invalid release tag: %s\nExpected vMAJOR.MINOR.PATCH or a SemVer prerelease.\n' \
              "${GITHUB_REF_NAME}" \
              >&2

            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}" \
            "origin/main"; then
            printf \
              'Tagged commit %s is not contained in origin/main.\n' \
              "${GITHUB_SHA}" \
              >&2

            exit 1
          fi

          printf 'Validated release tag: %s\n' "${GITHUB_REF_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Reject an existing version tag
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          readonly image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"

          if docker buildx imagetools inspect \
            "${image}" \
            >/dev/null 2>&1; then
            printf \
              'Refusing to overwrite existing image tag: %s\n' \
              "${image}" \
              >&2

            exit 1
          fi

          printf 'Release tag is available: %s\n' "${image}"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          sbom: true
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish summary
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            printf '## Published container image\n\n'
            printf '**Image:** `%s/%s`\n\n' \
              "${REGISTRY}" \
              "${IMAGE_NAME}"
            printf '**Digest:** `%s`\n\n' "${DIGEST}"
            printf '### Tags\n\n'

            while IFS= read -r tag; do
              [[ -n "${tag}" ]] &&
                printf -- '- `%s`\n' "${tag}"
            done <<<"${TAGS}"
          } >>"${GITHUB_STEP_SUMMARY}"
